global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend postgres
    bind *:5432
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200

    server order_db order_db:5432 check port 8008
    server order_db_standby order_db_standby:5432 check port 8008
