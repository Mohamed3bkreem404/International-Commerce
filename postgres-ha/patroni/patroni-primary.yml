scope: order-cluster
namespace: /service/
name: order-db-primary

restapi:
  listen: 0.0.0.0:8008
  connect_address: order_db:8008

etcd3:
  hosts:
    - etcd:2379

postgresql:
  listen: 0.0.0.0:5432
  connect_address: order_db:5432

  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/15/bin

  authentication:
    superuser:
      username: postgres
      password: "4015"

    replication:
      username: replicator
      password: replica_pass

    rewind:
      username: rewind_user
      password: rewind_pass

  parameters:
    wal_level: replica
    hot_standby: "on"
    max_wal_senders: 10
    max_replication_slots: 10
    wal_log_hints: "on"

  pg_hba:
    - local all all trust
    - host all all 0.0.0.0/0 scram-sha-256
    - host replication replicator 0.0.0.0/0 scram-sha-256

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10

    maximum_lag_on_failover: 1048576

    postgresql:
      use_pg_rewind: true
      use_slots: true