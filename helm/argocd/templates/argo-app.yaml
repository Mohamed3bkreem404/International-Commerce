apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mohamed3bkreem404/International-Commerce.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc/
    namespace:
  prune: true