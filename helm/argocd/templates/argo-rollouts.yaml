apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: rollouts-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Mohamed3bkreem404/International-Commerce.git
    targetRevision: main
    path: helm/rollout
    helm:
      releaseName: rollouts-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: rollouts-lab

  syncPolicy:
    automated:
      prune: {{ .Values.monitoring.syncPolicy.prune}}
      selfHeal: {{ .Values.monitoring.syncPolicy.selfHeal}}
    syncOptions:
      - CreateNamespace=true