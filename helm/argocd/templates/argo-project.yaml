apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: main-project
  namespace: {{ .Values.namespace }}

spec:
  description: Main project for Ecommerce and Monitoring

  sourceRepos:
    - {{ .Values.application.source.repoURL | quote }}
    - {{ .Values.monitoring.source.repoURL | quote }}

  destinations:
    - namespace: {{ .Values.application.destination.namespace | quote }}
      server: {{ .Values.application.destination.server | quote }}

    - namespace: {{ .Values.monitoring.destination.namespace | quote }}
      server: {{ .Values.monitoring.destination.server | quote }}

  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: policy
      kind: PodDisruptionBudget