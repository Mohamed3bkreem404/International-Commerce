apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.application.name}}-project
  namespace: {{ .Values.namespace}}
spec:
  description: Simple project for ecommerce app

  sourceRepos:
    - {{.Values.application.source.repoURL}}
  destinations:
    - namespace: {{ .Values.application.destination.namespace}}
      server: {{ .Values.application.destination.server}}
      #Here permit charts to create ns
{{/*  clusterResourceBlacklist:*/}}
{{/*    - group: ""*/}}
{{/*      kind: Namespace*/}}
      #Allowed resources to be created
  #Long horn storageclass must be cluster scoped
  clusterResourceWhitelist:
    - group: storage.k8s.io
      kind: StorageClass

    - group: gateway.networking.k8s.io
      kind: GatewayClass

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    # Workloads
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet

    # Core
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ServiceAccount

    # Monitoring CRDs
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: PrometheusRule

    # Networking
    - group: networking.k8s.io
      kind: Ingress

    # Autoscaling
    - group: autoscaling
      kind: HorizontalPodAutoscaler

    # Policy
    - group: policy
      kind: PodDisruptionBudget

    # Gateway API
    - group: gateway.networking.k8s.io
      kind: Gateway
    - group: gateway.networking.k8s.io
      kind: HTTPRoute

    # Argo Rollouts
    - group: argoproj.io
      kind: Rollout
