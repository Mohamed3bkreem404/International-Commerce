apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.fullname" .}}api-gateway-service
  namespace: {{ .Release.Namespace }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "9000"
spec:
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    app: api-gateway
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30000
  type: NodePort
