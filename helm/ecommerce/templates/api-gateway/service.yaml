apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.fullname" . }}-api-gateway-service
  namespace: {{ .Release.Namespace }}

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: {{ .Values.apiGateway.service.port | quote }}

spec:
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    app: api-gateway

  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: {{ .Values.apiGateway.service.port }}
      {{- if .Values.apiGateway.service.nodePort }}
      nodePort:
      {{ end}}

  type: NodePort