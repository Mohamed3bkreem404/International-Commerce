apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ecommerce.fullname" . }}-api-gateway-config
  namespace: {{ .Release.Namespace }}

data:
  API_USER_SERVICE_URL: "http://{{ include "ecommerce.fullname" . }}-user-service:9002"
  API_PRODUCT_SERVICE_URL: "http://{{ include "ecommerce.fullname" . }}-product-service:9001"
  API_CART_SERVICE_URL: "http://{{ include "ecommerce.fullname" . }}-cart-service:9003"
  API_ORDER_SERVICE_URL: "http://{{ include "ecommerce.fullname" . }}-order-service:9004"
  API_PAYMENT_SERVICE_URL: "http://{{ include "ecommerce.fullname" . }}-payment-service:9005"

  API_ALLOWED_ORIGIN_PATTERNS: {{ .Values.apiGateway.allowedOrigins | quote }}