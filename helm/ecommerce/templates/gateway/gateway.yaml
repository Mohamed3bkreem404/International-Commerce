apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "ecommerce.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}

spec:
  gatewayClassName: traefik

  listeners:
    - name: web
      protocol: HTTP
      port: 80
      hostname: {{ .Values.ingress.host | quote }}

      allowedRoutes:
        namespaces:
          from: Same