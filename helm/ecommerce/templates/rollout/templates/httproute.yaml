apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rollouts
spec:
  parentRefs:
    - name: ecommerce-gateway
      namespace: ecommerce-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/cart
      backendRefs:
        - name: cart-stable
          port: 80
          weight: 100
        - name: cart-canary
          port: 80
          weight: 0