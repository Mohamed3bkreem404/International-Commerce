apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cart-rollouts
spec:
  replicas: 10
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart-rollouts
          image: ineutrono/ecm-cart-server:v1
          ports:
            - name: http
              containerPort: 8080
  strategy:
    canary:
      stableService: cart-stable
      canaryService: cart-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: rollouts-demo
      steps:
        - setWeight: 10
        - pause: {}
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: {}
        - setWeight: 100