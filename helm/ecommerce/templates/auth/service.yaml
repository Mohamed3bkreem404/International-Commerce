apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.fullname" . }}-accounts-db
  namespace: {{ include .Release.Namespace}}
spec:
  selector:
    {{ include "ecommerce.selectorLabels" . | nindent 4}}
    app: accounts-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.fullname" . }}-user-service
  namespace: {{ include .Release.Namespace}}

spec:
  selector:
    {{ include "ecommerce.selectorLabels" .  | nindent 4}}
    app: user
  ports:
    - port: 9002
      targetPort: 9002
  type: ClusterIP
