apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce.fullname" .}}-redis-deployment
  namespace: {{ .Release.Namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{ include "ecommerce.selectorLabels" . | 6}}
      app: redis
  template:
    metadata:
      labels:
        {{ include "ecommerce.selectorLabels" . | 8}}
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
