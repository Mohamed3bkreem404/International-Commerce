apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ecommerce.fullname" . }}-frontend-config
  namespace: {{ .Release.Namespace }}

data:
  FRONTEND_API_PROXY_TARGET: "http://{{ include "ecommerce.fullname" . }}-api-gateway-service:{{ .Values.apiGateway.service.port }}"

  API_ALLOWED_ORIGIN_PATTERNS: {{ .Values.apiGateway.allowedOrigins | quote }}