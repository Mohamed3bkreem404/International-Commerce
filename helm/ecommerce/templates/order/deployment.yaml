
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce.fullname" . }}-order-deployment
  namespace: {{ .Release.Namespace}}
spec:
  replicas: {{ .Values.replicaCount}}
  selector:
    matchLabels:
      {{ include "ecommerce.selectorLabels" . | nindent 6}}
      app: order
  template:
    metadata:
      labels:
        {{ include "ecommerce.selectorLabels" . | nindent 8}}
        app: order
    spec:
      containers:
        - name: order
          image: ineutrono/ecm-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9004
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-order-config
                  key: ORDER_SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_PASSWORD
            - name: CART_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-order-config
                  key: ORDER_CART_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-order-config
                  key: ORDER_PORT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 9004
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 9004
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9004
            initialDelaySeconds: 5
            periodSeconds: 5

