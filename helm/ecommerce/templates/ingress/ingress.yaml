apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ecommerce.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}

spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ecommerce.fullname" . }}-api-gateway-service
                port:
                  number: {{ .Values.apiGateway.service.port }}

          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ecommerce.fullname" . }}-frontend-service
                port:
                  number: {{ .Values.frontend.service.port }}