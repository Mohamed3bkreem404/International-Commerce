apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.fullname" . }}-payment-db
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    db: payment-db

  ports:
    - port: 5432
      targetPort: 5432

  clusterIP: None
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.fullname" . }}-payment-service
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    app: payment

  ports:
    - port: {{ .Values.payment.service.port }}
      targetPort: {{ .Values.payment.service.port }}

  type: ClusterIP