apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce.fullname" . }}-product-deployment
  namespace: {{ .Release.Namespace}}
spec:
  replicas: {{ .Values.replicaCount}}
  selector:
    matchLabels:
      {{ include "ecommerce.selectorLabels" . | nindent 6}}
      app: product
  template:
    metadata:
      labels:
        {{ include "ecommerce.selectorLabels" . | nindent 8}}
        app: product
    spec:
      containers:
        - name: product
          image: ineutrono/ecm-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname"}}-product-config
                  key: PRODUCT_SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname"}}-product-config
                  key: PRODUCT_REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname"}}-product-config
                  key: PRODUCT_REDIS_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname"}}-product-config
                  key: PRODUCT_PORT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 5
