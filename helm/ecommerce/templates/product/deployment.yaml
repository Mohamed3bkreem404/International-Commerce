apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce.fullname" . }}-product-deployment
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "ecommerce.selectorLabels" . | nindent 6 }}
      app: product

  template:
    metadata:
      labels:
        {{- include "ecommerce.selectorLabels" . | nindent 8 }}
        app: product

    spec:
      containers:
        - name: product

          image: "{{ .Values.product.image.repository }}:{{ .Values.product.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.product.service.port }}

          env:

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-product-config
                  key: PRODUCT_SPRING_DATASOURCE_URL


            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.secrets.dbUsername | quote }}


            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.secrets.dbPassword | quote }}


            - name: JWT_SECRET
              value: {{ .Values.secrets.jwtSecret | quote }}


            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-product-config
                  key: PRODUCT_REDIS_HOST


            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-product-config
                  key: PRODUCT_REDIS_PORT


            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-product-config
                  key: PRODUCT_PORT


          resources:
{{ toYaml .Values.resources | nindent 12 }}


          startupProbe:
            tcpSocket:
              port: {{ .Values.product.service.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}


          livenessProbe:
            tcpSocket:
              port: {{ .Values.product.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}


          readinessProbe:
            tcpSocket:
              port: {{ .Values.product.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}