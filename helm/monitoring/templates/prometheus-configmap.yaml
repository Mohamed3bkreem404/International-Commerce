apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s


    scrape_configs:
      - job_name: 'cart-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ecommerce-cart-service.test:9003']

      - job_name: 'order-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ecommerce-order-service.test:9004']

      - job_name: 'payment-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ecommerce-payment-service.test:9005']

      - job_name: 'product-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ecommerce-product-service.test:9001']

      - job_name: 'user-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ecommerce-user-service.test:9002']

