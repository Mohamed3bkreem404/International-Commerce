apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s


    scrape_configs:
      - job_name: 'cart-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['cart-service.ecommerce-v2.svc.cluster.local:9003']

      - job_name: 'order-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['order-service.ecommerce-v2.svc.cluster.local:9004']

      - job_name: 'payment-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['payment-service.ecommerce-v2.svc.cluster.local:9005']

      - job_name: 'product-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['product-service.ecommerce-v2.svc.cluster.local:9001']

      - job_name: 'user-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['user-service.ecommerce-v2.svc.cluster.local:9002']

