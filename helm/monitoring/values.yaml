
prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    scrapeInterval: 15s

    additionalScrapeConfigs:
      - job_name: cart-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - ecommerce-cart-service.test:9003

      - job_name: order-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - ecommerce-order-service.test:9004

      - job_name: payment-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - ecommerce-payment-service.test:9005

      - job_name: product-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - ecommerce-product-service.test:9001

      - job_name: user-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - ecommerce-user-service.test:9002

grafana:
  enabled: true
  persistence:
    enabled: true
    type: PVC
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 5G

  replicas: 1

  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30300

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1
    secrets:
      - smtp-password

  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: neutmoha@gmail.com
      smtp_auth_username: neutmoha@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password/password
      smtp_require_tls: true

    route:
      receiver: email-notifications
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 1m

    receivers:
      - name: email-notifications
        email_configs:
          - to: neutmoha@gmail.com
