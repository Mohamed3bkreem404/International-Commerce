name: Deploy cart Service

on:
  push:
    branches: [ "main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up jdk 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with maven
        run: mvn clean package -DskipTests
        working-directory: Cart Service/Cart-Service

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ecm-cart-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecm-cart-service:latest
        working-directory: Cart Service/Cart-Service

      - name: deploy to k8s via ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo kubectl apply -k k8s-v2/ -n ecommerce-v2
            sudo kubectl rollout restart deployment/api-gateway-deployment -n ecommerce-v2