name: Deploy Cart Service

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Image Version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: Cart Service/Cart-Service
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        working-directory: Cart Service/Cart-Service
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ecm-cart-service:${{ env.VERSION }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ecm-cart-service:latest \
            .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecm-cart-service:${{ env.VERSION }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecm-cart-service:latest

