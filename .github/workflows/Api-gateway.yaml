name: Deploy api-gateway Service

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: API Gateway/API-Gateway

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build \
          --build-arg API_PROXY_TARGET=http://ecommerce-dev-api-gateway-service:9000 \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/ecm-api-gateway:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecm-api-gateway:latest
         
            

        working-directory: API Gateway/API-Gateway

