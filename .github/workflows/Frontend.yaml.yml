name: Deploy front
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checout code
        uses: actions/checkout@v3

      - name: setup jdk 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: build with maven
        run: mvn clean package -DskipTests
        working-directory: frontend

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: build and push docker images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ecm-frontend-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecm-frontend-service:latest
        working-directory: frontend

      - name: deploy to k8s vis ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo cd /home/ubuntu/International-Commerce
            git pull origin main
            sudo kubectl apply -k k8s-v2/ -n ecommerce-v2
            sudo kubectl rollout restart deployment/frontend-deployment -n ecommerce-v2