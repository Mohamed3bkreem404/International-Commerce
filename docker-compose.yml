
services:
  accounts_db:
    image: postgres:15
    container_name: accounts_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4015
      POSTGRES_DB: accounts_db
    volumes:
      - accounts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accounts_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - user-db
    cpus: '.1'
    mem_limit: 70m
    restart: unless-stopped


  products_db:
    image: postgres:15
    container_name: products_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4015
      POSTGRES_DB: products_db
    volumes:
      - products_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - product-db
    cpus: '.1'
    mem_limit: 70m
    restart: unless-stopped

  order_db:
    image: postgres:15
    container_name: order_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4015
      POSTGRES_DB: order_db
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - order-db
    cpus: '.1'
    mem_limit: 70m
    restart: unless-stopped

  cart_db:
    image: postgres:15
    container_name: cart_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4015
      POSTGRES_DB: cart_db
    volumes:
      - cart_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cart_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cart-db
    cpus: '.1'
    mem_limit: 70m
    restart: unless-stopped

  payment_db:
    image: postgres:15
    container_name: payment_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4015
      POSTGRES_DB: payment_db
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - payment-db
    cpus: '.1'
    mem_limit: 70m
    restart: unless-stopped

  user-service:
    image: ineutrono/ecm-user-service
    container_name: user-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://accounts_db:5432/accounts_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=4015
      - PORT=9002
    ports:
      - "9002:9002"
    depends_on:
      accounts_db:
        condition: service_healthy
    networks:
      - ecommerce-net
      - user-db
    cpus: '.5'
    mem_limit: 700m
    restart: on-failure:3
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9002/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  product-service:
    image: ineutrono/ecm-product-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://products_db:5432/products_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=4015
      - PRODUCT_SERVICE_URL=http://product-service:9001
      - PORT=9001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "9001:9001"
    depends_on:
      products_db:
        condition: service_healthy
    networks:
      - ecommerce-net
      - product-db
    cpus: '.5'
    mem_limit: 700m
    restart: on-failure:3
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9001/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  order-service:
    image: ineutrono/ecm-order-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order_db:5432/order_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=4015
      - CART_SERVICE_URL=http://cart-service:9003
      - PORT=9004
    ports:
      - "9004:9004"
    depends_on:
      order_db:
        condition: service_healthy
    networks:
      - ecommerce-net
      - order-db
    cpus: '.5'
    mem_limit: 700m
    restart: on-failure:3
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9004/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  payment-service:
    image: ineutrono/ecm-payment-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payment_db:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=4015
      - ORDER_SERVICE_URL=http://order-service:9004
      - PORT=9005
    ports:
      - "9005:9005"
    depends_on:
      payment_db:
        condition: service_healthy
    networks:
      - ecommerce-net
      - payment-db
    cpus: '.5'
    mem_limit: 700m
    restart: on-failure:3
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9005/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  cart-service:
    image: ineutrono/ecm-cart-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://cart_db:5432/cart_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=4015
      - PRODUCT_SERVICE_URL=http://product-service:9001
      - PORT=9003
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    ports:
      - "9003:9003"
    depends_on:
      cart_db:
        condition: service_healthy
    networks:
      - ecommerce-net
      - cart-db
    cpus: '.5'
    mem_limit: 700m
    restart: on-failure:3
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9003/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api-gateway:
    image: ineutrono/ecm-api-service
    environment:
      - USER_SERVICE_URL=http://user-service:9002
      - PRODUCT_SERVICE_URL=http://product-service:9001
      - CART_SERVICE_URL=http://cart-service:9003
      - ORDER_SERVICE_URL=http://order-service:9004
      - PAYMENT_SERVICE_URL=http://payment-service:9005
    ports:
      - "9000:9000"
    depends_on:
      user-service:
        condition: service_healthy

      product-service:
        condition: service_healthy

      order-service:
        condition: service_healthy

      payment-service:
        condition: service_healthy

      cart-service:
        condition: service_healthy
    networks:
      - ecommerce-net
    cpus: '.1'
    mem_limit: 400m
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9000/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    image: ineutrono/ecm-frontend-service:latest
    container_name: frontend
    environment:
      - API_PROXY_TARGET=http://api-gateway:9000
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-net
    cpus: '.2'
    mem_limit: 200m
    restart: on-failure:3

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
  product-db:
    name: product-db
    driver: bridge
  order-db:
    name: order-db
    driver: bridge
  user-db:
    name: user-db
    driver: bridge
  payment-db:
    name: payment-db
    driver: bridge
  cart-db:
    name: cart-db
    driver: bridge


volumes:
  accounts_data:
  products_data:
  order_data:
  cart_data:
  payment_data:
