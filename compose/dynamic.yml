http:
  middlewares:

    # ip-whitelist:
    #   ipAllowList:
    #     sourceRange:
    #       - ""



    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    api-rate-limit:
      rateLimit:
        average: 100
        burst: 50

    compress:
      compress: {}


#    #future middlewares
#    dashboard-auth:
#      basicAuth:
#        users:
#          #admin : admin x)
#          - "admin:$2y$05$vqIpyf5X6.8HKE9ohEKw.edvz2YDOhrX0kDwFt1OLheIvY0STvYHi"

    custom-error-pages:
      errors:
        status:
          - "500-599"
        service: error-pages-service
        query: "/{status}.html"

    frontend-chain:
      chain:
        middlewares:
          - security-headers
          - compress

    api-chain:
      chain:
        middlewares:
          - security-headers
          - api-rate-limit
          - compress

  services:
    error-pages-service:
      loadBalancer:
        servers:
          #container name with this port
          - url: "http://error-pages:80"
            weight: 2
            preservePath: true
        sticky:
          cookie:
            name: "error-pages-cookie"

    load-balancer:
      loadBalancer:
        servers:
          - url: "http://api-gateway-1:9000"
            preservePath: true
          - url: "http://api-gateway-2:9000"
            preservePath: true
        strategy: rr
        healthcheck:
          path: "/actuator/health"
          interval: "10s"
          timeout: "3s"
        passHostHeader: true
          

            
  

