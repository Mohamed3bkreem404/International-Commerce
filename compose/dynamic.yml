http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    api-rate-limit:
      rateLimit:
        average: 100
        burst: 50

    compress:
      compress: {}

#    #future middlewares
#    dashboard-auth:
#      basicAuth:
#        users:
#          #admin : admin x)
#          - "admin:$2y$05$vqIpyf5X6.8HKE9ohEKw.edvz2YDOhrX0kDwFt1OLheIvY0STvYHi"

    custom-error-pages:
      errors:
        status:
          - "500-599"
        service: error-pages-service
        query: "/{status}.html"

    frontend-chain:
      chain:
        middlewares:
          - security-headers
          - compress

    api-chain:
      chain:
        middlewares:
          - security-headers
          - api-rate-limit
          - compress
  services:
    error-pages-service:
      loadBalancer:
        servers:
          #container name with this port
          - url: "http://error-pages:80"

