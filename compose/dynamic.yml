http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000
        stsIncludesSubdomains: true

      api-rate-limit:
        rateLimit:
          average: 100
          burst: 50

      compress:
        {}

      #future middlewares
      auth:
        basicAuth:
          users:
            - "user:hashed password"

      custom-error-pages:
        errors:
          status:
            - "500-599"
          service: error-pages-service
          query: "/{status}.html"

      frontend-chain:
        chain:
          middlewares:
            - security-headers
            - compression

      api-chain:
        chain:
          middlewares:
            - security-headers
            - api-rate-limit
            - compress
  services:
    error-pages-service:
      loadBalancer:
        servers:
          #container name with this port
          - url: "http://error-pages:80"


tls:
  options:
    modern:
      minVersion: VersionTLS13