#static config for traefik

api:
  dashboard: true
  insecure: true

providers:
  #start , health_status  7s
  providersThrottleDuration: 8s
  docker:
    watch: true
    #false = only show containers with labels traefik.enable=true , better for security
    exposedByDefault: true
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  #default is error , debug for more details & troubleshooting
  level: INFO

accessLog:
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - "400-499"
      - "500-599"
    minDuration: "500ms"

  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Referer: keep
        Authorization: redact


metrics:
  prometheus:
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0


entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https


  websecure:
    address: ":443"



#ACME
certificatesResolvers:
  letsencrypt:
    acme:
      email: complexyt9002@gmail.com
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web
