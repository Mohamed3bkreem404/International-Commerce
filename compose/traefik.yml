#static config for traefik

api:
  dashboard: true
  insecure: true

providers:
  docker:
    watch: true
    #false = only show containers with labels traefik.enable=true , better for security
    exposedByDefault: true
  file:
    filename: /etc/traefik/dynamic.yml

log:
  level: INFO


entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"



#ACME
certificatesResolvers:
  letsencrypt:
    acme:
      email: complexyt9002@gmail.com
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

