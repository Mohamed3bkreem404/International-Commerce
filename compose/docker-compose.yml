include:
  - app.yml
  - databases.yml
  - proxy.yml
  - ../monitoring/docker-compose.yml

networks:
  ecommerce-net:
    driver: bridge
    name: ecommerce-net

  database-net:
    driver: bridge
    name: database-net

  monitoring-net:
    driver: bridge
    name: monitoring-net

volumes:
  payment_data:
  products_data:
  order_data:
  cart_data:
  accounts_data:
  grafana-data:
  alertmanager-data:
