apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: ecommerce-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ecm-api-service:cors-fix
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:9002
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:9001
            - name: CART_SERVICE_URL
              value: http://cart-service:9003
            - name: ORDER_SERVICE_URL
              value: http://order-service:9004
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:9005
            - name: ALLOWED_ORIGIN_PATTERNS
              value: "*"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce-v2
spec:
  selector:
    app: api-gateway
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
