apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yaml: |
    global:
        scrape_interval: 15s
        

    scrape_configs:
      - job_name: 'cart-service'
        metrics_path: /actutator/prometheus
        static_configs:
          - targets: ['cart-service:9003']
            
      - job_name: 'order-service'
        metrics_path: /actutator/prometheus
        static_configs:
          - targets: ['order-service:9004']
            
      - job_name: 'payment-service'
        metrics_path: /actutator/prometheus
        static_configs:
        - targets: ['payment-service:9005']
          
      - job_name: 'product-service'
        metrics_path: /actutator/prometheus
        static_configs:
          - targets: ['product-service:9001']
            
      - job_name: 'user-service'
        metrics_path: /actutator/prometheus
        static_configs:
          - targets: ['user-service:9002']
            
