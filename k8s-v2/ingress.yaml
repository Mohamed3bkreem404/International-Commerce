  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: ecommerce-ingress
  spec:
    ingressClassName: nginx
    rules:
      - host: international-commerce
        http:
          paths:
            - path: /api
              pathType: Prefix
              backend:
                service:
                  name: api-gateway
                  port:
                    number: 9000
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: frontend-service
                  port:
                    number: 3000