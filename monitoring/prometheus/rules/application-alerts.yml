groups:
  - name: application
    rules:
      - alert: ApplicationServiceDown
        expr: up{job="applications"} == 0
        for: 1m
        labels:
          severity: critical
          scope: application
        annotations:
          summary: "Application service is down"
          description: "{{ $labels.application }} at {{ $labels.instance }} has not been reachable by Prometheus for 1 minute."
          action: "Check container status, health endpoint, application logs, and Docker network."

      - alert: HighApplicationCPU
        expr: 100 * process_cpu_usage{job="applications"} > 80
        for: 5m
        labels:
          severity: warning
          scope: application
        annotations:
          summary: "High application CPU"
          description: "{{ $labels.application }} CPU usage is above 80% on {{ $labels.instance }}."
          action: "Check request load, JVM activity, hot endpoints, and container CPU usage."

      - alert: HighJVMHeapUsage
        expr: |
          100 *
          sum by (application, instance) (jvm_memory_used_bytes{job="applications",area="heap"})
          /
          clamp_min(sum by (application, instance) (jvm_memory_max_bytes{job="applications",area="heap"}), 1)
          > 85
        for: 5m
        labels:
          severity: warning
          scope: application
        annotations:
          summary: "High JVM heap usage"
          description: "{{ $labels.application }} heap usage is above 85% on {{ $labels.instance }}."
          action: "Check GC activity, allocation rate, traffic growth, and possible memory leaks."

      - alert: CriticalJVMHeapUsage
        expr: |
          100 *
          sum by (application, instance) (jvm_memory_used_bytes{job="applications",area="heap"})
          /
          clamp_min(sum by (application, instance) (jvm_memory_max_bytes{job="applications",area="heap"}), 1)
          > 95
        for: 2m
        labels:
          severity: critical
          scope: application
        annotations:
          summary: "Critical JVM heap usage"
          description: "{{ $labels.application }} heap usage is above 95% on {{ $labels.instance }}."
          action: "Inspect heap pressure and GC immediately; prepare restart/rollback if the service becomes unstable."

      - alert: HighHTTPResponseTime
        expr: |
          sum by (application) (rate(http_server_requests_seconds_sum{job="applications"}[5m]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count{job="applications"}[5m])), 0.001)
          > 1
        for: 5m
        labels:
          severity: warning
          scope: application
        annotations:
          summary: "Slow HTTP responses"
          description: "{{ $labels.application }} average response time is above 1 second."
          action: "Check downstream services, PostgreSQL, external calls, CPU, and recent deployments."

      - alert: HighHTTP5xxErrorRate
        expr: |
          100 *
          sum by (application) (rate(http_server_requests_seconds_count{job="applications",status=~"5.."}[5m]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count{job="applications"}[5m])), 0.001)
          > 5
        for: 3m
        labels:
          severity: critical
          scope: application
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "{{ $labels.application }} is returning more than 5% HTTP 5xx responses."
          action: "Open Loki logs for the service, inspect stack traces and dependencies, then rollback if linked to a release."

      - alert: HighHTTP4xxErrorRate
        expr: |
          100 *
          sum by (application) (rate(http_server_requests_seconds_count{job="applications",status=~"4.."}[5m]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count{job="applications"}[5m])), 0.001)
          > 20
        for: 10m
        labels:
          severity: warning
          scope: application
        annotations:
          summary: "High HTTP 4xx error rate"
          description: "{{ $labels.application }} is returning more than 20% HTTP 4xx responses."
          action: "Check authentication failures, bad routes, frontend/API contract issues, and suspicious client traffic."

      - alert: TooManyLiveThreads
        expr: jvm_threads_live_threads{job="applications"} > 300
        for: 10m
        labels:
          severity: warning
          scope: application
        annotations:
          summary: "High JVM thread count"
          description: "{{ $labels.application }} has more than 300 live threads on {{ $labels.instance }}."
          action: "Check blocked threads, thread pools, downstream latency, and thread leaks."

      - alert: FrequentGCPauses
        expr: rate(jvm_gc_pause_seconds_count{job="applications"}[5m]) > 1
        for: 10m
        labels:
          severity: warning
          scope: application
        annotations:
          summary: "Frequent JVM GC pauses"
          description: "{{ $labels.application }} is averaging more than one GC pause per second."
          action: "Inspect heap pressure, allocation rate, GC duration, and JVM memory sizing."