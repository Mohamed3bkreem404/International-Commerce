global:
  scrape_interval: 15s



scrape_configs:
  - job_name: "applications"
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/applications.yml
  - job_name: "databases"
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/databases.yml

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093


rule_files:
  - /etc/prometheus/rules/*.yml
