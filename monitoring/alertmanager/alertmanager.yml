route:
  receiver: telegram-notifications
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 10m
receivers:
  - name: telegram-notifications
    telegram_configs:
      - bot_token: "8806627768:AAGET_smgFZJ0RWGB9LA33iKrN-SJy1bAyc"
        chat_id: 5535089238
        send_resolved: true
        parse_mode: HTML
        message: |
          {{ if eq .Status "firing" }}🚨 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }}
          
          <b>Alert:</b> {{ .CommonLabels.alertname }}
          <b>Severity:</b> {{ .CommonLabels.severity }}
          <b>Scope:</b> {{ .CommonLabels.scope }}
          {{ if .CommonLabels.application }}<b>Application:</b> {{ .CommonLabels.application }}{{ end }}
          {{ if .CommonLabels.name }}<b>Container:</b> {{ .CommonLabels.name }}{{ end }}
          {{ if .CommonLabels.datname }}<b>Database:</b> {{ .CommonLabels.datname }}{{ end }}
          {{ if .CommonLabels.mountpoint }}<b>Mount:</b> {{ .CommonLabels.mountpoint }}{{ end }}
          {{ if .CommonLabels.instance }}<b>Instance:</b> {{ .CommonLabels.instance }}{{ end }}
          
          {{ range .Alerts }}
          <b>Summary:</b> {{ .Annotations.summary }}
          <b>Details:</b> {{ .Annotations.description }}
          {{ if .Annotations.action }}<b>Action:</b> {{ .Annotations.action }}{{ end }}
          {{ end }}