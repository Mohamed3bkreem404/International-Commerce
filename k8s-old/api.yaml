apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ineutrono/ecm-api-service:latest
          ports:
            - containerPort: 9000
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:9002
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:9001
            - name: CART_SERVICE_URL
              value: http://cart-service:9003
            - name: ORDER_SERVICE_URL
              value: http://order-service:9004
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:9005
            - name: ALLOWED_ORIGIN_PATTERNS
              value: "http://localhost:3000,http://192.168.49.2:30090"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
