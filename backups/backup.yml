services:
  postgres-backup:
    build:
      context: ./backup

    container_name: postgres-backup

    environment:
      PGPASSWORD: 4015
      DATABASES: "accounts_db products_db order_db cart_db payment_db"

    volumes:
      - postgres_backups:/backups

    depends_on:
      - accounts_db
      - products_db
      - order_db
      - cart_db
      - payment_db

    networks:
      - database-net

    restart: unless-stopped